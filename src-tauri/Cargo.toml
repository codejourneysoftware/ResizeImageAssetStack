[package]
name = "image_resize_asset_stack"
version = "1.0.0"
description = "Retro-styled App Store and Google Play screenshot asset resizing mainframe"
authors = ["Image Resize Asset Stack Contributors"]
edition = "2024"

[lib]
name = "image_resize_asset_stack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
